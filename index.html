<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3390ec" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233390ec'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E"
    />
    <title>aimana shop — мини-приложение</title>
    <!-- выбор темы применяем до первой отрисовки, чтобы не было вспышки -->
    <script>
      try {
        var theme = localStorage.getItem("aimana.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.tgScheme = theme;
        }
      } catch (e) {}
    </script>
    <!-- SDK Telegram Mini Apps. Внутри Telegram даёт window.Telegram.WebApp;
         в обычном браузере приложение работает без него (есть fallback-тема). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
